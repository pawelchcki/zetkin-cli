[project]
name = "zetkin-cli"
version = "0.1.0"
description = "Typed Python SDK and command-line client for the Zetkin API"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Pawel Chmielnicki" }]
dependencies = [
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "platformdirs>=4,<5",
  "pydantic>=2.11,<3",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.scripts]
zetkin = "zetkin_cli.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pyright>=1.1.405",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/zetkin_cli/cli.py" = ["B008"]
"src/zetkin_cli/generated/*.py" = ["E501"]

[tool.ruff.format]
exclude = ["src/zetkin_cli/generated/*.py"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnusedFunction = false
